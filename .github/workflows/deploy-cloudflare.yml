name: Deploy Prompt Manager to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Prepare static assets
        run: |
          rm -rf public
          mkdir -p public
          cp index.html app.js cloudflare.js style.css public/
          cp -R assets public/assets
          cp -R data public/data

      - name: Create Wrangler config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          cat > wrangler.toml <<EOF
          name = "prompt-manager"
          main = "worker.js"
          compatibility_date = "2026-10-01"

          [assets]
          directory = "./public"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "prompt-manager-db"
          database_id = "${CLOUDFLARE_D1_DATABASE_ID}"
          EOF

      - name: Initialize D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute prompt-manager-db --remote --file=./schema.sql

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
