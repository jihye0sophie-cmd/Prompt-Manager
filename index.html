<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prompt Manager</title><link rel="stylesheet" href="style.css?v=20261007-7"></head><body><div class="shell"><aside id="sidebar"><button id="sidebarClose" class="sidebarClose" type="button" aria-label="메뉴 닫기">×</button><h2>Prompt Manager</h2><p class="sub">콘텐츠 제작 작업실</p><nav id="nav"></nav><div class="bottom"><button id="syncBtn" class="ghost">저장 · 이미지 연결</button><button id="newPrompt">+ 새 프롬프트</button><button id="newSite" class="ghost">+ 새 사이트</button></div></aside><main><header><button id="menu">☰</button><input id="search" placeholder="프롬프트와 사이트 검색"><button id="newTop">+ 새 프롬프트</button></header><section><div class="head"><div><small id="eyebrow">PROMPT LIBRARY</small><h1 id="title">전체</h1><p id="desc">프롬프트와 콘텐츠 제작 사이트를 한곳에서 관리합니다.</p></div><div id="stats"></div></div><div class="tools"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="favorite">즐겨찾기</button><select id="sort"><option value="updated">최근 수정순</option><option value="title">이름순</option><option value="id">ID순</option></select></div><div id="grid"></div><div id="empty" class="hidden empty">아직 항목이 없습니다.</div></section></main></div><div id="overlay" class="hidden"></div><aside id="drawer" class="hidden"><div class="drawerHead"><div><small id="drawerEye"></small><h2 id="drawerTitle"></h2></div><button id="close">×</button></div><div id="drawerBody"></div></aside><div id="toast" class="hidden"></div><script src="app.js?v=20261007-7"></script><script src="cloudflare.js?v=20261007-7"></script></body></html>
